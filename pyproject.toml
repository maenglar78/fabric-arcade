[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fabric-arcade"
version = "0.2.0"
description = "🎮 Learn Microsoft Fabric by Playing - Gamified tutorials and demos"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Fabric Gaming Community", email = "arcade@fabric.example.com"}
]
keywords = [
    "microsoft-fabric",
    "data-engineering", 
    "real-time-intelligence",
    "power-bi",
    "gamification",
    "learning",
    "tutorial"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Games/Entertainment :: Simulation",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.25.0",
]

[project.optional-dependencies]
cli = [
    "azure-identity>=1.15.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-requests>=2.31.0",
]

[project.urls]
Homepage = "https://fabricarcade.github.io/fabric-arcade/"
Documentation = "https://fabricarcade.github.io/fabric-arcade/docs/"
Repository = "https://github.com/fabricarcade/fabric-arcade"
Issues = "https://github.com/fabricarcade/fabric-arcade/issues"
Changelog = "https://github.com/fabricarcade/fabric-arcade/blob/main/CHANGELOG.md"

[project.scripts]
fabric-arcade = "fabric_arcade.cli:main"
arcade = "fabric_arcade.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["fabric_arcade"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["fabric_arcade"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["fabric_arcade"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
