<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabric Arcade — Achievement Badge</title>
    <link rel="stylesheet" href="css/style.css">

    <!-- Open Graph / social preview -->
    <meta property="og:title" content="Fabric Arcade Achievement">
    <meta property="og:description" content="I just completed a Microsoft Fabric learning quest!">
    <meta property="og:image" content="https://fabric-arcade.netlify.app/badges/og-default.png">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { background: #0a0a14; color: #e8e8f0; font-family: 'Rajdhani', system-ui, sans-serif; margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 16px; }
        .wrap { max-width: 720px; width: 100%; text-align: center; }
        .crumb { color: #7a7aa0; font-size: 13px; margin-bottom: 8px; letter-spacing: 3px; text-transform: uppercase; font-family: 'Orbitron', monospace; }
        h1 { font-family: 'Orbitron', monospace; font-size: 26px; font-weight: 900; margin: 4px 0 28px; color: #a29bfe; letter-spacing: 2px; text-transform: uppercase; }
        .badge-stage { margin: 24px auto; padding: 28px; background: linear-gradient(135deg, #14142a 0%, #1c1438 100%); border-radius: 16px; box-shadow: 0 12px 60px rgba(108,92,231,0.2); display: inline-block; }
        .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 24px; }
        .btn { display: inline-block; padding: 12px 22px; border-radius: 8px; font-weight: 600; text-decoration: none; cursor: pointer; border: none; font-size: 14px; transition: transform .15s; font-family: inherit; }
        .btn:hover { transform: translateY(-2px); }
        .btn-primary { background: linear-gradient(135deg, #6c5ce7, #a29bfe); color: white; }
        .btn-secondary { background: rgba(255,255,255,0.08); color: #e8e8f0; border: 1px solid rgba(255,255,255,0.15); }
        .verdict { margin-top: 28px; font-size: 14px; color: #7a7aa0; }
        .verdict.ok { color: #55efc4; }
        .verdict.bad { color: #ff7675; }
        .meta { margin-top: 18px; color: #aaa; font-size: 13px; }
        .meta code { background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 4px; }
        a.back { color: #a29bfe; text-decoration: none; font-size: 13px; }
        a.back:hover { text-decoration: underline; }
        #error-card { display: none; padding: 36px; background: rgba(255,118,117,0.08); border: 1px solid rgba(255,118,117,0.3); border-radius: 12px; max-width: 520px; margin: 40px auto; }
        #error-card h2 { color: #ff7675; margin: 0 0 12px; }
    </style>
</head>
<body>
    <div class="wrap">
        <a href="/" class="back">← Fabric Arcade</a>
        <div class="crumb" style="margin-top:18px">Achievement Unlocked</div>
        <h1 id="game-title">Loading…</h1>

        <div id="badge-stage" class="badge-stage"></div>

        <div class="verdict" id="verdict"></div>

        <div class="actions">
            <button class="btn btn-primary" id="btn-download">⬇️ Download PNG</button>
            <button class="btn btn-secondary" id="btn-svg">⬇️ Download SVG</button>
            <a class="btn btn-secondary" id="btn-linkedin" target="_blank" rel="noopener">Share on LinkedIn</a>
            <a class="btn btn-secondary" id="btn-twitter"  target="_blank" rel="noopener">Share on X</a>
            <button class="btn btn-secondary" id="btn-copy">Copy link</button>
        </div>

        <div class="meta" id="meta"></div>
    </div>

    <div id="error-card">
        <h2>⚠️ Invalid or tampered badge</h2>
        <p>This badge link cannot be verified. Make sure you opened the exact link generated by the game's <code>03_Check</code> notebook (or equivalent final step).</p>
        <p><a class="back" href="/">← Back to Fabric Arcade</a></p>
    </div>

<script>
// =============================================================================
// MUST stay in sync with fabric_arcade/badge.py :: BADGE_SECRET
// =============================================================================
const FA_BADGE_SECRET = "fabric-arcade-badge-v1-7K9mP3xQ";

// Game registry — icon + accent palette for the medal.
// Add new games here as they ship.
const GAMES = {
    "calc-groups-cathedral": { icon: "🏛️", name: "Calc Groups Cathedral",  accent: "#a29bfe", deep: "#6c5ce7" },
    "fabric-racing-game":    { icon: "🏎️", name: "Fabric Racing Game",     accent: "#ff7675", deep: "#d63031" },
    "monster-breach":        { icon: "🧙‍♂️", name: "Monster Breach",        accent: "#fdcb6e", deep: "#e17055" },
    "ontology-detective":    { icon: "🕵️", name: "Ontology Detective",      accent: "#55efc4", deep: "#00b894" },
    "city-builder":          { icon: "🏙️", name: "City Builder",           accent: "#81ecec", deep: "#00cec9" },
    "quest-pipeline":        { icon: "🏰", name: "Quest Data Pipeline",    accent: "#dfe6e9", deep: "#b2bec3" },
    "sports-tracker":        { icon: "⚽", name: "Sports Tracker",           accent: "#55efc4", deep: "#00b894" },
    "retro-arcade":          { icon: "🕹️", name: "Retro Arcade",            accent: "#fab1a0", deep: "#e17055" },
    "ocean-explorer":        { icon: "🌊", name: "Ocean Explorer",          accent: "#74b9ff", deep: "#0984e3" },
    "target-practice":       { icon: "🎯", name: "Target Practice",         accent: "#ffeaa7", deep: "#fdcb6e" },
};

// ----- base64url helpers -----
function b64uDecode(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    const bin = atob(s);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
}

function bytesToHex(bytes) {
    return Array.from(bytes).map(b => b.toString(16).padStart(2, "0")).join("");
}

function constantTimeEq(a, b) {
    if (a.length !== b.length) return false;
    let x = 0;
    for (let i = 0; i < a.length; i++) x |= a[i] ^ b[i];
    return x === 0;
}

async function verify(token) {
    const dot = token.indexOf(".");
    if (dot < 0) return null;
    const body  = b64uDecode(token.slice(0, dot));
    const sig   = b64uDecode(token.slice(dot + 1));
    const key = await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(FA_BADGE_SECRET),
        { name: "HMAC", hash: "SHA-256" },
        false,
        ["sign"]
    );
    const expected = new Uint8Array(await crypto.subtle.sign("HMAC", key, body));
    if (!constantTimeEq(expected, sig)) return null;
    try {
        return JSON.parse(new TextDecoder().decode(body));
    } catch (e) { return null; }
}

function escapeXml(s) {
    return String(s).replace(/[<>&'"]/g, c => ({
        "<": "&lt;", ">": "&gt;", "&": "&amp;", "'": "&apos;", "\"": "&quot;"
    }[c]));
}

function fmtDate(epoch) {
    const d = new Date(epoch * 1000);
    return d.toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
}

function buildSvg(payload) {
    const g = GAMES[payload.g] || { icon: "🎮", name: payload.g, accent: "#a29bfe", deep: "#6c5ce7" };
    const player = escapeXml(payload.p || "Anonymous");
    const rank   = escapeXml(payload.r || "Champion");
    const score  = Number(payload.s || 0).toLocaleString();
    const date   = fmtDate(payload.t || (Date.now() / 1000));
    const gname  = escapeXml(g.name);
    const skills = Array.isArray(payload.k) ? payload.k.slice(0, 5).map(s => String(s).slice(0, 24)) : [];
    const W = 600, H = 600;

    // Build skill chips (laid out on one or two centered rows)
    let chipsSvg = "";
    if (skills.length) {
        const PAD_X = 12, GAP = 8, CHIP_H = 22, FONT = 12;
        // measure approx width: 7.2px per char * len + padding*2
        const widths = skills.map(s => Math.max(60, Math.round(s.length * 7.2 + PAD_X * 2)));
        // pack into rows that fit within ~ W - 80
        const MAX_W = W - 80;
        const rows = [[]];
        let rowW = 0;
        widths.forEach((w, i) => {
            if (rowW + w + (rows[rows.length-1].length ? GAP : 0) > MAX_W) {
                rows.push([]); rowW = 0;
            }
            rows[rows.length - 1].push({ text: skills[i], w });
            rowW += w + GAP;
        });
        const startY = 552;
        rows.forEach((row, ri) => {
            const totalW = row.reduce((a, c) => a + c.w, 0) + GAP * (row.length - 1);
            let x = (W - totalW) / 2;
            const y = startY + ri * (CHIP_H + 6);
            row.forEach(c => {
                chipsSvg += `
    <g>
      <rect x="${x.toFixed(1)}" y="${y}" rx="11" ry="11" width="${c.w}" height="${CHIP_H}"
            fill="rgba(255,255,255,0.06)" stroke="${g.accent}" stroke-opacity="0.6" stroke-width="1"/>
      <text x="${(x + c.w/2).toFixed(1)}" y="${y + CHIP_H/2 + 4}" text-anchor="middle"
            font-family="Rajdhani, sans-serif" font-size="${FONT}" font-weight="600"
            fill="#f0e6ff" letter-spacing="1">${escapeXml(c.text).toUpperCase()}</text>
    </g>`;
                x += c.w + GAP;
            });
        });
    }

    const scoreY = skills.length ? (552 + Math.ceil(skills.length / 3) * 28 + 6) : 574;

    return `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
  <defs>
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap');
    ]]></style>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#14142a"/>
      <stop offset="100%" stop-color="#1c1438"/>
    </linearGradient>
    <radialGradient id="medal" cx="50%" cy="42%" r="55%">
      <stop offset="0%"   stop-color="${g.accent}"/>
      <stop offset="60%"  stop-color="${g.deep}"/>
      <stop offset="100%" stop-color="#2d1b3d"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="${g.deep}"/>
      <stop offset="100%" stop-color="${g.accent}"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="${W}" height="${H}" rx="28" fill="url(#bg)"/>

  <!-- top banner -->
  <text x="${W/2}" y="58" text-anchor="middle"
        font-family="Orbitron, monospace" font-size="18" font-weight="900" fill="${g.accent}" letter-spacing="6">
    FABRIC ARCADE
  </text>
  <text x="${W/2}" y="88" text-anchor="middle"
        font-family="Rajdhani, sans-serif" font-size="14" font-weight="500" fill="#7a7aa0" letter-spacing="5">
    ACHIEVEMENT BADGE
  </text>

  <!-- ribbon -->
  <polygon points="${W/2-70},120 ${W/2+70},120 ${W/2+90},220 ${W/2},190 ${W/2-90},220"
           fill="url(#ribbon)" opacity="0.85"/>

  <!-- medal disc -->
  <circle cx="${W/2}" cy="280" r="125" fill="url(#medal)" stroke="${g.accent}" stroke-width="4" filter="url(#glow)"/>
  <circle cx="${W/2}" cy="280" r="102" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-dasharray="3 4"/>

  <!-- game icon (emoji) -->
  <text x="${W/2}" y="308" text-anchor="middle" font-size="100" font-family="Segoe UI Emoji, Apple Color Emoji, Noto Color Emoji, sans-serif">
    ${g.icon}
  </text>

  <!-- game name -->
  <text x="${W/2}" y="442" text-anchor="middle"
        font-family="Orbitron, monospace" font-size="22" font-weight="700" fill="#f0e6ff" letter-spacing="3">
    ${gname.toUpperCase()}
  </text>

  <!-- rank -->
  <text x="${W/2}" y="476" text-anchor="middle"
        font-family="Rajdhani, sans-serif" font-size="22" font-weight="600" fill="${g.accent}" letter-spacing="2">
    ${rank}
  </text>

  <!-- player -->
  <text x="${W/2}" y="512" text-anchor="middle"
        font-family="Rajdhani, sans-serif" font-size="17" font-weight="500" fill="#e8e8f0" letter-spacing="1">
    awarded to ${player}
  </text>

  <!-- skills chips -->
  ${chipsSvg}

  <!-- score + date -->
  <text x="${W/2}" y="${scoreY}" text-anchor="middle"
        font-family="Orbitron, monospace" font-size="12" font-weight="500" fill="#7a7aa0" letter-spacing="3">
    SCORE ${score}  ·  ${date.toUpperCase()}
  </text>
</svg>`;
}

async function svgToPngBlob(svgString, scale = 2) {
    const W = 600 * scale, H = 600 * scale;
    const svgBlob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
    const url = URL.createObjectURL(svgBlob);
    const img = new Image();
    img.crossOrigin = "anonymous";
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
    const canvas = document.createElement("canvas");
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, W, H);
    URL.revokeObjectURL(url);
    return await new Promise(res => canvas.toBlob(res, "image/png"));
}

function download(blob, filename) {
    const u = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = u; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 1000);
}

async function main() {
    const params = new URLSearchParams(location.search);
    const token = params.get("t");
    if (!token) {
        document.querySelector(".wrap").style.display = "none";
        document.getElementById("error-card").style.display = "block";
        return;
    }
    const payload = await verify(token);
    if (!payload) {
        document.querySelector(".wrap").style.display = "none";
        document.getElementById("error-card").style.display = "block";
        return;
    }

    const g = GAMES[payload.g] || { name: payload.g };
    document.getElementById("game-title").textContent = g.name;

    const svgString = buildSvg(payload);
    document.getElementById("badge-stage").innerHTML = svgString;

    document.getElementById("verdict").className = "verdict ok";
    document.getElementById("verdict").textContent = "✓ Signature verified";

    document.getElementById("meta").innerHTML =
        `Issued <code>${fmtDate(payload.t)}</code> · player <code>${escapeXml(payload.p)}</code> · rank <code>${escapeXml(payload.r)}</code> · score <code>${payload.s}</code>` +
        (Array.isArray(payload.k) && payload.k.length
          ? ` · skills <code>${payload.k.map(s => escapeXml(String(s))).join(", ")}</code>`
          : "");

    const safePlayer = String(payload.p).replace(/[^a-z0-9-]+/gi, "_").slice(0, 40) || "player";
    const fileBase = `fabric-arcade_${payload.g}_${safePlayer}`;

    document.getElementById("btn-svg").onclick = () =>
        download(new Blob([svgString], { type: "image/svg+xml" }), `${fileBase}.svg`);

    document.getElementById("btn-download").onclick = async (e) => {
        e.target.disabled = true; e.target.textContent = "Rendering…";
        try {
            const png = await svgToPngBlob(svgString, 2);
            download(png, `${fileBase}.png`);
        } finally {
            e.target.disabled = false; e.target.textContent = "⬇️ Download PNG";
        }
    };

    const shareText = `I just earned the "${payload.r}" badge in ${g.name} on Fabric Arcade! 🎮`;
    const shareUrl = location.href;
    document.getElementById("btn-linkedin").href =
        `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(shareUrl)}`;
    document.getElementById("btn-twitter").href =
        `https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}&url=${encodeURIComponent(shareUrl)}`;
    document.getElementById("btn-copy").onclick = async () => {
        try {
            await navigator.clipboard.writeText(shareUrl);
            const b = document.getElementById("btn-copy");
            const old = b.textContent; b.textContent = "✓ Copied"; setTimeout(() => b.textContent = old, 1500);
        } catch (e) { alert("Copy failed: " + e); }
    };
}

main().catch(err => {
    console.error(err);
    document.querySelector(".wrap").style.display = "none";
    document.getElementById("error-card").style.display = "block";
});
</script>

</body>
