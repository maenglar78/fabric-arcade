# Fabric Arcade - Release & Deploy Workflow
# Publishes to PyPI and deploys website on release

name: Release & Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      deploy_website:
        description: 'Deploy website only'
        type: boolean
        default: false
      publish_pypi:
        description: 'Publish to PyPI'
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ============================================
  # Publish to PyPI
  # ============================================
  publish-pypi:
    name: 📦 Publish to PyPI
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || inputs.publish_pypi
    environment:
      name: pypi
      url: https://pypi.org/project/fabric-arcade/
    permissions:
      id-token: write  # For trusted publishing

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: 🏗️ Build package
        run: python -m build

      - name: 📤 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses trusted publishing - no token needed

  # ============================================
  # Deploy Website to GitHub Pages
  # ============================================
  deploy-website:
    name: 🌐 Deploy Website
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || inputs.deploy_website
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Pages
        uses: actions/configure-pages@v4

      - name: 📦 Build website
        run: |
          # Copy website files
          mkdir -p _site
          cp -r website/* _site/
          
          # Generate game pages from catalog
          python -c "
          import json
          from pathlib import Path
          
          # Create games directory
          games_dir = Path('_site/games')
          games_dir.mkdir(exist_ok=True)
          
          # Generate page for each game
          catalog_dir = Path('catalog')
          for game_dir in catalog_dir.iterdir():
              if not game_dir.is_dir():
                  continue
              
              readme = game_dir / 'README.md'
              manifest = game_dir / 'manifest.json'
              
              if readme.exists() and manifest.exists():
                  with open(manifest) as f:
                      meta = json.load(f)
                  
                  # Create simple redirect/info page
                  html = f'''<!DOCTYPE html>
          <html>
          <head>
              <title>{meta['name']} - Fabric Arcade</title>
              <meta http-equiv=\"refresh\" content=\"0; url=../docs/{meta['id']}.html\">
              <link rel=\"stylesheet\" href=\"../css/style.css\">
          </head>
          <body>
              <div style=\"text-align:center; padding:50px;\">
                  <h1>{meta.get('icon', '🎮')} {meta['name']}</h1>
                  <p>Redirecting to documentation...</p>
              </div>
          </body>
          </html>'''
                  
                  (games_dir / f\"{meta['id']}.html\").write_text(html)
                  print(f'  ✅ Generated {meta[\"id\"]}.html')
          "

      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ============================================
  # Create GitHub Release Assets
  # ============================================
  release-assets:
    name: 📎 Upload Release Assets
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Build package
        run: |
          pip install build
          python -m build

      - name: 📋 Create catalog bundle
        run: |
          # Create a zip of the catalog for offline use
          zip -r fabric-arcade-catalog.zip catalog/

      - name: 📤 Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            fabric-arcade-catalog.zip

  # ============================================
  # Notify on Success
  # ============================================
  notify:
    name: 📢 Notify
    runs-on: ubuntu-latest
    needs: [publish-pypi, deploy-website]
    if: always() && github.event_name == 'release'

    steps:
      - name: 📢 Post release summary
        run: |
          echo "## 🎮 Fabric Arcade Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ github.event.release.tag_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Links" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 [PyPI Package](https://pypi.org/project/fabric-arcade/)" >> $GITHUB_STEP_SUMMARY
          echo "- 🌐 [Website](https://fabricarcade.github.io/fabric-arcade/)" >> $GITHUB_STEP_SUMMARY
          echo "- 📚 [Documentation](https://fabricarcade.github.io/fabric-arcade/docs/)" >> $GITHUB_STEP_SUMMARY
