# Fabric Arcade - PR Preview Workflow
# Deploys preview of website changes for PRs

name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'website/**'
      - 'catalog/**'
      - 'docs/**'

jobs:
  preview:
    name: 🔍 Deploy Preview
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏗️ Build preview
        run: |
          mkdir -p preview
          cp -r website/* preview/

      - name: 🚀 Deploy to Netlify
        uses: nwtgck/actions-netlify@v2
        with:
          publish-dir: './preview'
          production-deploy: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "PR Preview for #${{ github.event.pull_request.number }}"
          enable-pull-request-comment: true
          enable-commit-comment: false
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5
        continue-on-error: true  # Don't fail if Netlify not configured
